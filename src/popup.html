<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="ptitle"><img src="icons/icon32.png" width="22" height="22" alt=""> <span>Claude 툴팁 번역</span></header>

  <div class="card list">
    <label class="item switch"><span>마우스 오버 번역</span><input id="hoverEnabled" type="checkbox"></label>
    <label class="item switch"><span>드래그 번역</span><input id="selectionEnabled" type="checkbox"></label>
  </div>

  <div class="card">
    <label class="item lang"><span>번역할 언어</span><select id="targetLang" aria-label="번역할 언어"></select></label>
    <div id="models"></div>
  </div>

  <div id="status" class="small muted"></div>
  <button id="openOptions" type="button" class="full weak">설정 열기</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
